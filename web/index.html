<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Document</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="./styles/sections.css" />
  <link rel="stylesheet" href="./styles/sidebar.css" />

  <style>
    body {
      margin: 0;
      /* filter: invert(1);
      background-color: black; */
    }

    .layout {
      display: flex;
      font-family: KaTeX_Typewriter;
    }
  </style>
</head>

<body>

  <div class="layout">

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" />

    <label for="sidebar-toggle" class="drawer-button">
      Contents
    </label>

    <label for="sidebar-toggle" class="drawer-backdrop"></label>

    <div class="sidebar-container">
      <h3>Contents</h3>

      <ul class="sidebar-list">
        <li><a href="#introduction">Introduction</a></li>
        <li><a href="#epipolar-constraint">Epipolar Constraint</a></li>
        <li><a href="#epipolar-lines">Epipolar Lines</a></li>
        <li><a href="#rectification-goal">Rectification Goal</a></li>
        <li><a href="#rectification-construction">Rectification Construction</a></li>
      </ul>
    </div>

    <div id="content-container" class="content-container"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <script>
    async function loadSection() {

      const introductionResponse = await fetch("./sections/introduction.html");
      const epipolarConstraintResponse = await fetch("./sections/epipolar-constraint.html");
      const epipolarLinesResponse = await fetch("./sections/epipolar-lines.html");
      const rectificationGoalResponse = await fetch("./sections/rectification-goal.html");
      const rectificationConstructionResponse = await fetch("./sections/rectification-construction.html");

      const introductionHtml = await introductionResponse.text();
      const epipolarConstraintHtml = await epipolarConstraintResponse.text();
      const epipolarLinesResponseHtml = await epipolarLinesResponse.text();
      const rectificationGoalResponseHtml = await rectificationGoalResponse.text();
      const rectificationConstructionResponseHtml = await rectificationConstructionResponse.text();


      const container = document.getElementById("content-container");

      container.innerHTML += introductionHtml;
      container.innerHTML += epipolarConstraintHtml;
      container.innerHTML += epipolarLinesResponseHtml;
      container.innerHTML += rectificationGoalResponseHtml;
      container.innerHTML += rectificationConstructionResponseHtml;

      renderMathInElement(container, {
        delimiters: [
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false }
        ]
      });
    }

    loadSection();
  </script>

</body>

</html>
